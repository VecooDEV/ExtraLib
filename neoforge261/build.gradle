plugins {
    id 'net.neoforged.moddev'
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

version = "${project_version}-26.1-NeoForge"

neoForge {
    version = "${neoforge_261}"

    mods {
        extralib {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('run/client')
        }

        server {
            server()
            gameDirectory = layout.projectDirectory.dir('run/server')
            programArgument '--nogui'
        }
    }
}

sourceSets.main.java.srcDir(rootProject.file('common261/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common261/src/main/resources'))

dependencies {
    implementation project(':core')

}

apply from: rootProject.file('gradle/library-dependencies.gradle')
apply from: rootProject.file('gradle/shadow.gradle')

configurations.additionalRuntimeClasspath.extendsFrom(configurations.shadow)

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

jar {
    archiveClassifier = 'dev'
}

processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                'project_name': project_name,
                'project_version': project_version
        )
    }
}

def gradleProperties = new Properties()
def gradlePropertiesFile = new File(rootProject.file("/.gradle/gradle.properties").path)

if (gradlePropertiesFile.exists()) {
    gradlePropertiesFile.withInputStream { gradleProperties.load(it) }
}

modrinth {
    token = gradleProperties.getProperty("MODRINTH_API_KEY")
    projectId = "extralib"
    versionName = "${project_name}-${version}"
    versionNumber = project_version
    versionType = "release"
    changelog = rootProject.file("changelog.md").text
    uploadFile = shadowJar
    gameVersions = ["26.1", "26.1.1", "26.1.2"]
    loaders = ["neoforge"]
}

versionedRelease.dependsOn("shadowJar")
build.finalizedBy('versionedRelease')

apply from: rootProject.file('gradle/curseforge.gradle')
