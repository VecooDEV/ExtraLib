plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    apply plugin: 'idea'
    apply plugin: 'java'

    group = 'com.vecoo.extralib'
    version = project_version

    jar {
        archiveBaseName.set(project.name in ['core', 'common20', 'common21'] ? "${rootProject.name}-${project.name}" : rootProject.name)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.incremental = true
    }

    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.opencollab.dev/maven-snapshots'
        }
    }
}

def loaderModules = subprojects.findAll {
    it.name.startsWith('forge') || it.name.startsWith('neoforge') || it.name.startsWith('fabric')
}

configure(loaderModules) {
    tasks.named('processResources') {
        inputs.properties(project_name: project_name, project_version: project_version)
    }

    tasks.register('versionedRelease', Copy) {
        group = 'build'
        description = 'Copies the finished mod JAR to the shared release directory.'

        from(layout.buildDirectory.dir('libs')) {
            include '*Forge.jar', '*NeoForge.jar', '*Fabric.jar'
        }

        into(rootProject.layout.projectDirectory.dir('release'))
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds every shared module and every implemented loader.'
    dependsOn(subprojects.collect {
        "${it.path}:build"
    })
}

tasks.register('clean') {
    group = 'build'
    dependsOn(subprojects.collect {
        "${it.path}:clean"
    })
}

tasks.register('versionedRelease') {
    group = 'build'
    description = 'Builds and collects every implemented loader.'
    dependsOn(loaderModules.collect {
        "${it.path}:build"
    })
}
