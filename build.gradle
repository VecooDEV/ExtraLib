plugins {
    id 'fabric-loom' version '1.19+' apply false
    id 'net.fabricmc.fabric-loom' version '1.19+' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1' apply false
}

subprojects {
    apply plugin: 'idea'
    apply plugin: 'java'

    group = 'com.vecoo.extralib'
    version = project_version

    jar {
        archiveBaseName.set(project.name in ['core', 'common20', 'common21', 'common261'] ? "${rootProject.name}-${project.name}" : rootProject.name)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.incremental = true
    }

    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.opencollab.dev/maven-snapshots'
        }
    }
}

def loaderModules = subprojects.findAll {
    it.name.startsWith('forge') || it.name.startsWith('neoforge') || it.name.startsWith('fabric')
}

configure(loaderModules) {
    tasks.named('processResources') {
        inputs.properties(project_name: project_name, project_version: project_version)
    }

    tasks.register('versionedRelease', Copy) {
        group = 'build'
        description = 'Collects the current mod JAR and removes previous releases of this module.'

        dependsOn {
            tasks.named(project.name == 'forge20' ? 'renameJarToSrg' : project.name in ['fabric20', 'fabric21'] ? 'remapJar' : 'shadowJar')
        }

        def moduleProject = project

        def oldReleases = providers.provider {
            def suffix = moduleProject.version.toString().substring(moduleProject.property('project_version').toString().length())

            moduleProject.rootProject.fileTree('release') {
                include "${moduleProject.rootProject.name}-*${suffix}.jar"
                exclude "${moduleProject.rootProject.name}-${moduleProject.version}.jar"
            }
        }

        from(providers.provider {
            moduleProject.layout.buildDirectory.file("libs/${moduleProject.rootProject.name}-${moduleProject.version}.jar").get()
        })

        into(moduleProject.rootProject.layout.projectDirectory.dir('release'))

        outputs.upToDateWhen {
            oldReleases.get().isEmpty()
        }

        doFirst {
            oldReleases.get().files.each {
                java.nio.file.Files.delete(it.toPath())
            }
        }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds every shared module and every implemented loader.'
    dependsOn(subprojects.collect {
        "${it.path}:build"
    })
}

tasks.register('clean') {
    group = 'build'
    dependsOn(subprojects.collect {
        "${it.path}:clean"
    })
}

tasks.register('versionedRelease') {
    group = 'build'
    description = 'Builds and collects every implemented loader.'
    dependsOn(loaderModules.collect {
        "${it.path}:build"
    })
}

tasks.register('publishCurseforge') {
    group = 'publishing'
    description = 'Publishes every implemented loader to CurseForge.'
    dependsOn(loaderModules.collect {
        "${it.path}:publishCurseforge"
    })
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Runs the configured publishing tasks for every implemented loader.'
    dependsOn(loaderModules.collect {
        "${it.path}:publishMods"
    })
}
