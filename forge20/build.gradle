plugins {
    id 'net.minecraftforge.gradle' version '[7.0.31,8.0)'
    id 'net.minecraftforge.renamer' version '1.1.7'
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

version = "${project_version}-1.20.1-Forge"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir("run/${name}")

            environment 'MOD_CLASSES', files(sourceSets.main.output, project(':core').sourceSets.main.output).collect {
                "extralib%%${it.absolutePath}"
            }.join(File.pathSeparator)

            extraLibraries configurations.shadow

            mods {
                extralib {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

sourceSets.main.java.srcDir(rootProject.file('common20/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common20/src/main/resources'))

dependencies {
    implementation project(':core')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation minecraft.dependency("net.minecraftforge:forge:1.20.1-${forge_20}")
}

apply from: rootProject.file('gradle/library-dependencies.gradle')
apply from: rootProject.file('gradle/shadow.gradle')

tasks.named('jar') {
    enabled = false
}

renamer {
    mappings(minecraft.dependency.toSrg.get())
    enableMixinRefmaps {
        source(sourceSets.main) {
            refMap = 'extralib.refmap.json'
        }
        config 'extralib.mixins.json'
        jar(tasks.named('shadowJar', Jar))

        minecraft.runs.each { runConfig ->
            run(runConfig)
        }
    }
}

tasks.named('compileJava') {
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')).withPropertyName('mixinRefmap')
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')).withPropertyName('mixinMappings')
}

renamer.mixin.generatedMappings.configure {
    dependsOn(tasks.named('compileJava'))
}

renamer.classes('renameJarToSrg', tasks.named('shadowJar', Jar)) {
    mappings(renamer.mixin.generatedMappings)
    dependsOn(tasks.named('compileJava'))
    output = layout.buildDirectory.file("libs/${rootProject.name}-${project.version}.jar").get().asFile
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand(
                'project_name': project_name,
                'project_version': project_version
        )
    }
}

def gradleProperties = new Properties()
def gradlePropertiesFile = new File(rootProject.file("/.gradle/gradle.properties").path)

if (gradlePropertiesFile.exists()) {
    gradlePropertiesFile.withInputStream { gradleProperties.load(it) }
}

modrinth {
    token = gradleProperties.getProperty("MODRINTH_API_KEY")
    projectId = "extralib"
    versionName = "${project_name}-${version}"
    versionNumber = project_version
    versionType = "release"
    changelog = rootProject.file("changelog.md").text
    uploadFile = layout.buildDirectory.file("libs/${rootProject.name}-${project.version}.jar")
    gameVersions = ["1.20.1"]
    loaders = ["forge"]
}

build.finalizedBy('versionedRelease')
