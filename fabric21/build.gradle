plugins {
    id 'fabric-loom'
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

base {
    archivesName = "${project_name}"
}

version = "${project_version}-1.21.1-Fabric"

loom {
    mods {
        extralib {
            sourceSet sourceSets.main
            modFiles.from(project(':core').sourceSets.main.output)
        }
    }

    runs {
        client {
            runDir 'run/client'
        }

        server {
            runDir 'run/server'
        }
    }
}

sourceSets.main.java.srcDir(rootProject.file('common21/src/main/java'))
sourceSets.main.resources.srcDir(rootProject.file('common21/src/main/resources'))

dependencies {
    implementation project(':core')
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_21}"

    include(modImplementation("me.lucko:fabric-permissions-api:${fabric_permissions_api_21}"))
}

apply from: rootProject.file('gradle/library-dependencies.gradle')
apply from: rootProject.file('gradle/shadow.gradle')

remapJar {
    dependsOn shadowJar
    input.set(shadowJar.archiveFile)
}

processResources {
    filesMatching('fabric.mod.json') {
        expand(
                'project_name': project_name,
                'project_version': project_version
        )
    }
}

def gradleProperties = new Properties()
def gradlePropertiesFile = new File(rootProject.file("/.gradle/gradle.properties").path)

if (gradlePropertiesFile.exists()) {
    gradlePropertiesFile.withInputStream { gradleProperties.load(it) }
}

modrinth {
    token = gradleProperties.getProperty("MODRINTH_API_KEY")
    projectId = "extralib"
    versionName = "${project_name}-${version}"
    versionNumber = project_version
    versionType = "release"
    changelog = rootProject.file("changelog.md").text
    uploadFile = remapJar
    gameVersions = ["1.21.1"]
    loaders = ["fabric"]
}

build.finalizedBy('versionedRelease')
